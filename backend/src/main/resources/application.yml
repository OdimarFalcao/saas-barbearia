spring:
  application:
    name: barbearia

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/barbearia}
    username: ${POSTGRES_USER:barbearia}
    password: ${POSTGRES_PASSWORD:barbearia_dev_local}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${APP_PORT:8080}

app:
  admin-inicial:
    email: ${ADMIN_INICIAL_EMAIL:}
    senha: ${ADMIN_INICIAL_SENHA:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5433/barbearia_test}
  flyway:
    baseline-on-migrate: true
